name: ci

# Runs lint + typecheck + test + build so the agent-ops dispatch pipeline has a
# real status check to gate auto-merge on -- decideAutoMerge() in agent-ops'
# scripts/dispatch requires ciState === "success", matching
# knowledge-base/config.yml's test_command ("bun test && tsc --noEmit").
#
# e2e-smoke was excluded 2026-08-29 through 2026-09-07: main had 8 pre-existing
# failures caused by two committed fixture files (examples/mixed.log,
# examples/mixed-2.log) being silently untracked -- excluded by a contributor's
# global `*.log` gitignore rule, with no git-status signal they were ever
# missing. Fixed via an explicit `!examples/*.log` repo-level gitignore
# exception; the full suite now runs in `test`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # log-cli is a public repo -- the org's self-hosted ci-runners group has
    # allows_public_repositories=false, so this stays on a GitHub-hosted
    # runner (see .catesworks-standards baseline: public-repo-exception).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected needs full history to diff against main

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Set turbo flags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_FLAGS=--affected" >> "$GITHUB_ENV"
          else
            echo "TURBO_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: bunx turbo run lint $TURBO_FLAGS

      - name: Typecheck
        run: bunx turbo run typecheck $TURBO_FLAGS

      - name: Test
        run: bunx turbo run test $TURBO_FLAGS

      - name: Build
        run: bunx turbo run build $TURBO_FLAGS
