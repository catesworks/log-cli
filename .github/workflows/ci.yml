name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # log-cli is a public repo -- the org's self-hosted ci-runners group has
    # allows_public_repositories=false, so this stays on a GitHub-hosted
    # runner (see .catesworks-standards baseline: public-repo-exception).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected needs full history to diff against main

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Set turbo flags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_FLAGS=--affected" >> "$GITHUB_ENV"
          else
            echo "TURBO_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: bunx turbo run lint $TURBO_FLAGS

      - name: Typecheck
        run: bunx turbo run typecheck $TURBO_FLAGS

      # tests/e2e-smoke.test.ts is excluded by the `test` script itself (8
      # pre-existing failures unrelated to this workflow, tracked since
      # 2026-08-29 -- not fixed by this change). Re-enable it in package.json
      # once those are fixed.
      - name: Test
        run: bunx turbo run test $TURBO_FLAGS

      - name: Build
        run: bunx turbo run build $TURBO_FLAGS
